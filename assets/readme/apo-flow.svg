<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title description">
  <title id="title">AI_Orchestrator target flow</title>
  <desc id="description">Owner intent moves through planning, routing, execution, validation, review, and acceptance.</desc>
  <defs>
    <linearGradient id="brandLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" />
      <stop offset="0.48" stop-color="#00FFC8" />
      <stop offset="1" stop-color="#D946EF" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="180" rx="22" fill="#0A0F1E" stroke="#26395B" />
  <text x="34" y="32" fill="#A3B1C6" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.5">APO - TARGET ORCHESTRATION FLOW</text>
  <path d="M70 96 H830" fill="none" stroke="#26395B" stroke-width="3" />
  <path d="M70 96 H830" fill="none" stroke="url(#brandLine)" stroke-width="2" stroke-dasharray="18 14" filter="url(#softGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="3.8s" repeatCount="indefinite" />
  </path>
  <g fill="#0F1B33" stroke="url(#brandLine)" stroke-width="2" filter="url(#softGlow)">
    <circle cx="70" cy="96" r="13" />
    <circle cx="196" cy="96" r="13" />
    <circle cx="322" cy="96" r="13" />
    <circle cx="448" cy="96" r="13" />
    <circle cx="574" cy="96" r="13" />
    <circle cx="700" cy="96" r="13" />
    <circle cx="830" cy="96" r="13" />
  </g>
  <g fill="#F4F7FB" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">
    <text x="70" y="137">OWNER</text>
    <text x="196" y="137">WORK ITEM</text>
    <text x="322" y="137">PLAN</text>
    <text x="448" y="137">ROUTE</text>
    <text x="574" y="137">EXECUTE</text>
    <text x="700" y="137">VALIDATE</text>
    <text x="830" y="137">ACCEPT</text>
  </g>
  <circle cx="70" cy="96" r="5" fill="#E6F6FF">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
  </circle>
</svg>
